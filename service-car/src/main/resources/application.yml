server:
  port: 8082

spring:
  application:
    name: SERVICE-CAR
  datasource:
    url: jdbc:h2:mem:carservicedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: true
